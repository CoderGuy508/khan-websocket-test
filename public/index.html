<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coder Guy WebSocket Test</title>
<style>body{margin:0;background:#0c131e;color:#dceeff;font:15px system-ui}main{max-width:800px;margin:30px auto;padding:0 18px}a{color:#79ccff}canvas{display:block;width:100%;background:#111e2e;border:1px solid #7bcfff55;border-radius:8px}form{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}input,button{padding:9px;border-radius:5px;border:1px solid #7198ad77;background:#15283b;color:white}small{color:#9cb7cc}h1{font-size:22px}</style>
<main><h1>Coder Guy WebSocket Test</h1><p><a href="/bridge.user.js">Install Khan bridge userscript</a></p><small>Open the Khan test in two browsers, choose the same room, then click the canvas and use WASD. Or test this server here.</small>
<form id="join"><input id="name" aria-label="Player name" maxlength="16" value="Player"><input id="room" aria-label="Room" maxlength="24" value="LOBBY"><button id="connect">Connect</button><span id="status" role="status">Offline</span></form><canvas id="world" width="800" height="600" tabindex="0" aria-label="Multiplayer movement canvas"></canvas><p id="players"></p></main>
<script>
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),playersLabel=document.getElementById('players');
let socket=null,players=[],selfId='',keys={up:false,down:false,left:false,right:false};
document.getElementById('join').addEventListener('submit',event=>{event.preventDefault();if(socket){socket.close();socket=null;return;}const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');socket=ws;status.textContent='Connecting';ws.onopen=()=>ws.send(JSON.stringify({type:'join',name:document.getElementById('name').value,room:document.getElementById('room').value}));ws.onmessage=event=>{const data=JSON.parse(event.data);if(data.type==='welcome'){selfId=data.id;status.textContent='Connected · '+data.room;document.getElementById('connect').textContent='Disconnect';canvas.focus();}if(data.type==='snapshot'){players=data.players;playersLabel.textContent=players.map(p=>p.name+' ('+p.x+', '+p.y+')').join(' · ');}if(data.type==='error'){status.textContent=data.message;}};ws.onclose=()=>{if(socket===ws){socket=null;players=[];status.textContent='Offline';document.getElementById('connect').textContent='Connect';}};ws.onerror=()=>{status.textContent='Connection error';};});
const mapping={w:'up',ArrowUp:'up',s:'down',ArrowDown:'down',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right'};
canvas.addEventListener('keydown',event=>{if(mapping[event.key]){keys[mapping[event.key]]=true;event.preventDefault();}});canvas.addEventListener('keyup',event=>{if(mapping[event.key]){keys[mapping[event.key]]=false;event.preventDefault();}});canvas.addEventListener('blur',()=>{keys={up:false,down:false,left:false,right:false};});setInterval(()=>{if(socket&&socket.readyState===WebSocket.OPEN){socket.send(JSON.stringify({type:'input',keys}));}},50);
function draw(){ctx.clearRect(0,0,800,600);ctx.strokeStyle='#7bcfff16';for(let x=0;x<=800;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,600);ctx.stroke();}for(let y=0;y<=600;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke();}players.forEach(p=>{ctx.beginPath();ctx.fillStyle=p.color;ctx.arc(p.x,p.y,12,0,Math.PI*2);ctx.fill();if(p.id===selfId){ctx.beginPath();ctx.strokeStyle='white';ctx.arc(p.x,p.y,17,0,Math.PI*2);ctx.stroke();}ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillStyle='#dceeff';ctx.fillText(p.name,p.x,p.y-25);});requestAnimationFrame(draw);}draw();
</script></html>
